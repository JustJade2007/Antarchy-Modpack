["Path Settings"]
	#Time limit to perform required steps before the progress resets. (24,000 ticks = 1 Minecraft day).
	# Default: 24000
	# Range: 1000 ~ 72000
	constructionTime = 24000
	#Number of steps to create a path (e.g., 20)
	# Default: 20
	# Range: 1 ~ 1000
	requiredPasses = 20
	#Enable speed boost on paths
	enableSpeedBoost = true
	#Movement speed multiplier added on paths (ADD_MULTIPLIED_TOTAL). 0.2 matches Speed I.
	# Default: 0.2
	# Range: 0.01 ~ 1.0
	speedMultiplier = 0.2
	#Ticks until path decays (24000 ticks = 1 in-game day).
	# Default: 72000
	# Range: 1000 ~ 144000
	decayTime = 72000
